[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome-cookie-reader"
version = "0.1.0"
description = "Read decrypted Chrome cookies on macOS"
requires-python = ">=3.10"
dependencies = ["cryptography"]
license = "MIT"
authors = [{ name = "WoojinAhn" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/WoojinAhn/chrome-cookie-reader"
Source = "https://github.com/WoojinAhn/chrome-cookie-reader"

[project.scripts]
chrome-cookies = "chrome_cookies:main"
